[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "nex-bill-backend"
version = "0.1.0"
description = "NexBill Invoice Management System Backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    "boto3>=1.34.0",
    "sendgrid>=6.11.0",
    "stripe>=9.12.0",
    "weasyprint>=62.3",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "black>=24.4.2",
    "isort>=5.13.2",
    "mypy>=1.10.0",
    "types-passlib>=1.7.7",
]



# ── Black ──────────────────────────────────────────
[tool.black]
line-length = 79
target-version = ["py314"]

# ── isort ──────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 79

# ── Ruff ───────────────────────────────────────────
[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

# ── mypy ───────────────────────────────────────────
[tool.mypy]
strict = true
python_version = "3.14"
ignore_missing_imports = true

# ── pytest ─────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
